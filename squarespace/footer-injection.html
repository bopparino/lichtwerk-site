<!-- lichtwerk footer. Paste into Settings → Advanced → Code Injection → Footer. -->
<script>
/* Runs the homepage dither and seat calculator if the code block's script
   did not (some editors strip script tags). Also redraws after Squarespace
   swaps the page content. Safe to load on every page. */
(function () {
  var drawing = false;

  function paint(el, fn, col) {
    if (typeof dither !== "function") return;
    if (!el || el.clientWidth < 2 || el.clientHeight < 2) return;
    var w = Math.ceil(el.clientWidth / 4);
    var h = Math.ceil(el.clientHeight / 4);
    var key = w + "x" + h;
    if (el.getAttribute("data-lw-size") === key) return;
    if (col) dither(el, fn, 4, col);
    else dither(el, fn, 4);
    el.setAttribute("data-lw-size", key);
  }

  function draw() {
    if (drawing) return;
    drawing = true;
    try {
      paint(document.getElementById("c3"), (x,y)=>{const g=(Math.abs(((x*8)%1)-.5)<.03||Math.abs(((y*10)%1)-.5)<.03)?1:0;const d=Math.hypot(x-.55,(y-.35)*1.3);return Math.max(g*.5,Math.max(0,.9-d*1.6))}, [11,11,10]);
      paint(document.getElementById("c4"), (x,y,a)=>{const cx=.66;const half=.03+y*.30;const d=Math.abs(x-cx);let v=d<half?(1-d/half)**.7*(1-y*.55):0;const lamp=Math.exp(-((x-cx)*(x-cx)*a*a+(y*y))*60);return Math.min(1,v*.75+lamp)}, null);
      paint(document.getElementById("b1"), (x,y)=>{const w=.5+.5*Math.sin(x*14)*Math.cos(x*5);return (1-y)*(.45+.55*w)}, [255,210,31]);
      paint(document.getElementById("b2"), (x,y)=>{const w=.5+.5*Math.sin(x*14+2)*Math.cos(x*5);return (1-y)*(.45+.55*w)}, [11,11,10]);
    } finally {
      drawing = false;
    }
  }

  function bindCalc() {
    var u = document.getElementById("u");
    var un = document.getElementById("un");
    var l1 = document.getElementById("l1");
    var v1 = document.getElementById("v1");
    var minrow = document.getElementById("minrow");
    var v2 = document.getElementById("v2");
    var v3 = document.getElementById("v3");
    var v4 = document.getElementById("v4");
    var v5 = document.getElementById("v5");
    if (!u || !un || !l1 || !v1 || !minrow || !v2 || !v3 || !v4 || !v5) return;
    if (u.dataset.lwBound === "1") return;
    u.dataset.lwBound = "1";
    let R=150;const f=n=>'$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
    function calc(){const n=+u.value;un.textContent=n;const base=n*R,sub=Math.max(base,1000),tax=Math.round(sub*3)/100;
    l1.textContent=n+(n==1?' user':' users')+' × $'+R;v1.textContent=f(base);minrow.style.display=base<1000?'flex':'none';v2.textContent='+ '+f(1000-base);
    v3.textContent=f(tax);v4.textContent=f(sub+tax);const m=sub-175;v5.textContent=f(m+Math.round(m*3)/100)}
    document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.seg button').forEach(x=>x.classList.remove('on'));b.classList.add('on');R=+b.dataset.r;calc()});
    u.oninput=calc;calc();
  }

  function boot() {
    draw();
    bindCalc();
  }

  window.lwBoot = boot;

  if (!window.__lwHooks) {
    window.__lwHooks = true;
    window.addEventListener("resize", function () { if (window.lwBoot) window.lwBoot(); });
    window.addEventListener("load", function () { if (window.lwBoot) window.lwBoot(); });
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(function () { if (window.lwBoot) window.lwBoot(); });
    }
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();

(function () {
  if (window.__lwFooter) return;
  window.__lwFooter = true;
  function needsWork() {
    var u = document.getElementById("u");
    if (u && u.getAttribute("data-lw-bound") !== "1") return true;
    var ids = ["c3", "c4", "b1", "b2"];
    for (var i = 0; i < ids.length; i++) {
      var el = document.getElementById(ids[i]);
      if (!el || el.clientWidth < 2 || el.clientHeight < 2) continue;
      var key = Math.ceil(el.clientWidth / 4) + "x" + Math.ceil(el.clientHeight / 4);
      if (el.getAttribute("data-lw-size") !== key) return true;
    }
    return false;
  }
  function tick() {
    if (!needsWork()) return;
    if (typeof window.lwBoot === "function") window.lwBoot();
  }
  var target = document.getElementById("siteWrapper") || document.body;
  var scheduled = false;
  if (window.MutationObserver && target) {
    new MutationObserver(function () {
      if (scheduled) return;
      scheduled = true;
      requestAnimationFrame(function () { scheduled = false; tick(); });
    }).observe(target, { childList: true, subtree: true });
  }
  window.addEventListener("load", tick);
  tick();
})();
</script>

<script>
/* Phone menu. Runs on every page. Guarded so a code block and the footer can both include it. */
(function () {
  if (window.__lwNav) return;
  window.__lwNav = true;

  var overlay = null;
  var openBtn = null;
  var lockedY = 0;
  var closeTimer = 0;

  function reducedMotion() {
    return window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  }
  function mobile() {
    return window.matchMedia("(max-width: 1100px)").matches;
  }
  function park() {
    var fresh = document.getElementById("lw-nav");
    if (!fresh) return null;
    if (overlay && overlay !== fresh && overlay.parentNode) overlay.parentNode.removeChild(overlay);
    overlay = fresh;
    if (overlay.parentNode !== document.body) document.body.appendChild(overlay);
    return overlay;
  }
  function setExpanded(on) {
    var buttons = document.querySelectorAll(".nav-toggle");
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].setAttribute("aria-expanded", on ? "true" : "false");
      buttons[i].setAttribute("aria-label", on ? "Close menu" : "Open menu");
    }
  }
  function setInert(on) {
    var kids = document.body.children;
    for (var i = 0; i < kids.length; i++) {
      var el = kids[i];
      if (overlay && el === overlay) continue;
      if (on) {
        if (!el.hasAttribute("data-lw-inert")) el.setAttribute("data-lw-inert", el.hasAttribute("inert") ? "1" : "0");
        el.inert = true;
      } else if (el.getAttribute("data-lw-inert") === "0") {
        el.inert = false;
        el.removeAttribute("data-lw-inert");
      } else if (el.hasAttribute("data-lw-inert")) {
        el.removeAttribute("data-lw-inert");
      }
    }
  }
  function lockScroll() {
    lockedY = window.scrollY || document.documentElement.scrollTop || 0;
    document.documentElement.classList.add("lw-nav-lock");
    document.body.style.top = "-" + lockedY + "px";
  }
  function unlockScroll() {
    if (!document.documentElement.classList.contains("lw-nav-lock")) return;
    document.documentElement.classList.remove("lw-nav-lock");
    document.body.style.top = "";
    window.scrollTo(0, lockedY);
  }
  function finishClose(el) {
    if (!el || el.classList.contains("is-open")) return;
    el.hidden = true;
  }
  function openMenu(btn) {
    if (!mobile()) return;
    park();
    if (!overlay) return;
    clearTimeout(closeTimer);
    openBtn = btn || document.querySelector("#lw .nav-toggle");
    overlay.hidden = false;
    overlay.setAttribute("aria-hidden", "false");
    void overlay.offsetWidth;
    overlay.classList.add("is-open");
    setExpanded(true);
    lockScroll();
    setInert(true);
    var closeBtn = overlay.querySelector(".nav-close");
    if (closeBtn) closeBtn.focus();
  }
  function closeMenu(restore) {
    if (!overlay || !overlay.classList.contains("is-open")) return;
    var el = overlay;
    el.classList.remove("is-open");
    el.setAttribute("aria-hidden", "true");
    setExpanded(false);
    setInert(false);
    unlockScroll();
    clearTimeout(closeTimer);
    if (reducedMotion()) finishClose(el);
    else {
      closeTimer = setTimeout(function () { finishClose(el); }, 320);
      el.addEventListener("transitionend", function onEnd(ev) {
        if (ev.target !== el || ev.propertyName !== "opacity") return;
        el.removeEventListener("transitionend", onEnd);
        clearTimeout(closeTimer);
        finishClose(el);
      });
    }
    if (restore && openBtn && typeof openBtn.focus === "function") openBtn.focus();
  }
  function focusable() {
    if (!overlay) return [];
    var nodes = overlay.querySelectorAll("a[href], button:not([disabled])");
    var list = [];
    for (var i = 0; i < nodes.length; i++) {
      var r = nodes[i].getClientRects();
      if (r && r.length) list.push(nodes[i]);
    }
    return list;
  }

  document.addEventListener("click", function (e) {
    var t = e.target;
    if (!t || !t.closest) return;
    var toggle = t.closest(".nav-toggle");
    if (toggle) {
      e.preventDefault();
      if (overlay && overlay.classList.contains("is-open")) closeMenu(true);
      else openMenu(toggle);
      return;
    }
    if (!overlay || !overlay.classList.contains("is-open")) return;
    if (t.closest(".nav-close")) {
      e.preventDefault();
      closeMenu(true);
      return;
    }
    if (t.closest("#lw-nav a")) closeMenu(false);
  });

  document.addEventListener("keydown", function (e) {
    if (!overlay || !overlay.classList.contains("is-open")) return;
    if (e.key === "Escape" || e.key === "Esc") {
      e.preventDefault();
      closeMenu(true);
      return;
    }
    if (e.key !== "Tab") return;
    var list = focusable();
    if (!list.length) return;
    var first = list[0];
    var last = list[list.length - 1];
    if (e.shiftKey && document.activeElement === first) {
      e.preventDefault();
      last.focus();
    } else if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault();
      first.focus();
    }
  });

  document.addEventListener("focusin", function (e) {
    if (!overlay || !overlay.classList.contains("is-open")) return;
    if (overlay.contains(e.target)) return;
    var list = focusable();
    if (list.length) list[0].focus();
  });

  window.addEventListener("resize", function () {
    if (!mobile() && overlay && overlay.classList.contains("is-open")) closeMenu(false);
  });

  if (window.MutationObserver && document.body) {
    var scheduled = false;
    new MutationObserver(function () {
      if (scheduled) return;
      scheduled = true;
      requestAnimationFrame(function () {
        scheduled = false;
        var fresh = document.getElementById("lw-nav");
        if (fresh && overlay && fresh !== overlay && overlay.classList.contains("is-open")) {
          overlay.classList.remove("is-open");
          setExpanded(false);
          setInert(false);
          unlockScroll();
          overlay = null;
        }
        park();
      });
    }).observe(document.body, { childList: true, subtree: true });
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", park);
  else park();
})();
</script>
